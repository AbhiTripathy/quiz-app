
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QUIZROOM — Test Your Knowledge</title>
    <link rel="stylesheet" href="../styles/main.css">
    <script src="../js/home.js" defer></script>
</head>
<body>

    <header class="navbar">
        <a href="index.html" class="logo">Q.</a>

        <nav class="nav-left">
            <a href="#quizzes" class="nav-pill active">EXPLORE</a>
            <a href="#about" class="nav-pill">ABOUT</a>
        </nav>

        <p class="nav-message">
            A PLACE TO TEST WHAT YOU KNOW.
        </p>

        <nav class="nav-right">
          <a href="/pages/auth.html?mode=login&role=user"
            class="nav-pill">LOGIN</a>

          <a href="/pages/auth.html?mode=register&role=user"
            class="nav-pill">SIGN UP ↗</a>
        </nav>
    </header>

    <main>

        <!-- Hero -->
        <section class="hero">
            <h1>QUIZROOM</h1>

            <div class="hero-bottom">
                <p>THINK. ANSWER. REPEAT.</p>
                <p>KNOWLEDGE IS NEVER FINISHED.</p>
            </div>
        </section>

        <!-- Quiz collection -->
        <section class="collection" id="quizzes">

            <div class="filter-bar">

                <div class="filters">
                    <span class="filter-label">FILTER:</span>

                    <button class="filter-btn active"
                        data-category="all">ALL</button>

                    <button class="filter-btn"
                        data-category="programming">PROGRAMMING</button>

                    <button class="filter-btn"
                        data-category="science">SCIENCE</button>

                    <button class="filter-btn"
                        data-category="mathematics">MATH</button>

                    <button class="filter-btn"
                        data-category="general">GENERAL</button>
                </div>

                <div class="display-controls">
                    <span class="filter-label">DISPLAY:</span>

                    <button class="view-btn"
                        data-view="stack">☰ STACK</button>

                    <button class="view-btn active"
                        data-view="grid">▦ GRID</button>
                </div>

            </div>

            <div class="collection-intro">
                <h2>
                    Challenge what you know.
                    <br>
                    Find out what you don't.
                </h2>

                <p id="quiz-count">EXPLORE OUR COLLECTION</p>
            </div>

            <!-- Quiz cards generated by JS -->
            <div class="quiz-container stack" id="quiz-container">
            </div>

        </section>

        <footer id="about">
            <span>QUIZROOM © 2026</span>
            <span>BUILT FOR THE CURIOUS.</span>
            <a href="#">BACK TO TOP ↑</a>
        </footer>

    </main>

</body>
</html>
