
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QUIZROOM — Account</title>
    <link rel="stylesheet" href="../styles/auth.css">
    <script src="../js/auth.js" defer></script>
</head>
<body>

    <header class="navbar">
        <a href="index.html" class="logo">Q.</a>

        <nav>
            <a href="index.html" class="nav-pill">EXPLORE</a>
            <a href="auth.html?mode=login&role=admin"
               class="nav-pill" id="admin-link">ADMIN ↗</a>
        </nav>
    </header>

    <main class="auth-layout">

        <section class="auth-intro">
            <span class="eyebrow" id="eyebrow">YOUR KNOWLEDGE JOURNEY</span>

            <h1 id="hero-title">WELCOME<br>BACK.</h1>

            <p id="hero-description">
                Pick up where you left off.
                There's always something new to learn.
            </p>

            <span class="intro-bottom">THINK. ANSWER. REPEAT.</span>
        </section>

        <section class="auth-panel">

            <div class="auth-heading">
                <span class="eyebrow" id="form-label">ACCOUNT ACCESS</span>
                <h2 id="form-title">Sign in.</h2>
                <p id="form-description">
                    Enter your credentials to continue.
                </p>
            </div>

            <form id="auth-form">

                <div class="form-field" id="name-field">
                    <label for="name">FULL NAME</label>
                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Your name"
                        autocomplete="name"
                        minlength="2"
                    >
                </div>

                <div class="form-field">
                    <label for="email">EMAIL ADDRESS</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="you@example.com"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="form-field">
                    <label for="password">PASSWORD</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        minlength="8"
                        required
                    >
                </div>

                <div class="form-field" id="confirm-field">
                    <label for="confirm-password">CONFIRM PASSWORD</label>
                    <input
                        type="password"
                        id="confirm-password"
                        name="confirmPassword"
                        placeholder="Re-enter your password"
                        autocomplete="new-password"
                    >
                </div>

                <div class="form-field" id="invite-field">
                    <label for="invite-code">ADMIN INVITATION CODE</label>
                    <input
                        type="password"
                        id="invite-code"
                        name="inviteCode"
                        placeholder="Enter your invitation code"
                    >
                </div>

                <p class="form-error" id="form-error" role="alert"></p>

                <button type="submit" class="submit-btn" id="submit-btn">
                    SIGN IN ↗
                </button>

            </form>

            <div class="auth-switch">
                <span id="switch-text">New here?</span>
                <a href="#" id="switch-link">Create an account ↗</a>
            </div>

            <div class="auth-footer">
                <a href="index.html">← BACK TO EXPLORE</a>
                <span id="role-label">USER ACCOUNT</span>
            </div>

        </section>

    </main>

</body>
</html>
